<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Game</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #1d4a22;
    font-family: "Space Mono", monospace;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
}

#scoreboard {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 12px 25px;
    background: rgba(15, 25, 20, 0.85);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 5px;
    color: white;
    z-index: 10;
    font-family: "Orbitron", "Space Mono", monospace;
    font-size: 17px;
    white-space: nowrap;
}

.team { display: flex; align-items: center; gap: 9px; font-weight: bold; }
.team-dot { width: 13px; height: 13px; border-radius: 50%; }

#timer {
    padding: 5px 12px;
    background: #e8e8df;
    color: #222;
    border-radius: 3px;
    font-weight: bold;
    font-size: 19px;
    min-width: 64px;
    text-align: center;
}

#message {
    position: fixed;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 1px 2px 3px black;
    z-index: 10;
    white-space: nowrap;
}

button {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    padding: 13px 32px;
    border: 2px solid white;
    border-radius: 4px;
    background: #e9e7dc;
    color: #1c3325;
    font-family: "Space Mono", monospace;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.5px;
}

button:hover { background: white; }

button.hidden { display: none !important; }

#controls {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    text-shadow: 1px 1px 2px black;
    z-index: 10;
    white-space: nowrap;
}
</style>
</head>

<body>

<div id="scoreboard">
    <div class="team">
        <span class="team-dot" style="background:#38a9e8"></span>
        CHICKEN ON FIRE
        <span id="playerScore">0</span>
    </div>

    <div id="timer">2:00</div>

    <div class="team">
        <span id="robotScore">0</span>
        BEAVER BULLDOZER
        <span class="team-dot" style="background:#e45a50"></span>
    </div>
</div>

<div id="message"></div>

<button id="startButton">START GAME</button>



<canvas id="gameCanvas" width="1200" height="800"></canvas>

    robotScore = 0;
    matchTime = 120;

    updateScoreboard();
    resetPositions();

    gameState = "playing";
    messageElement.textContent = "Kickoff!";
    startButton.classList.add("hidden");
    startButton.blur();

    lastTime = 0;
}

document.addEventListener("keydown", function(event) {
    const key = event.key.toLowerCase();
    keys[key] = true;

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        event.preventDefault();
    }
});

document.addEventListener("keyup", function(event) {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", function() {
    for (const k in keys) keys[k] = false;
});

function movePlayer(dt) {
    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) dy--;
    if (keys["s"] || keys["arrowdown"]) dy++;
    if (keys["a"] || keys["arrowleft"]) dx--;
    if (keys["d"] || keys["arrowright"]) dx++;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;

    keepInsideField(player);
}

function moveRobot(dt) {
    // Robot attacks the LEFT goal, so it first gets to the right of the ball
    let tx = ball.x;
    let ty = ball.y;

    if (robot.x < ball.x + 25) {
        tx = ball.x + 70;
        ty = ball.y + (robot.y < ball.y ? -40 : 40);
    }

    const dx = tx - robot.x;
    const dy = ty - robot.y;
    const distance = Math.hypot(dx, dy);

    if (distance > 1) {
        robot.x += dx / distance * robot.speed * dt;
        robot.y += dy / distance * robot.speed * dt;
    }

    keepInsideField(robot);
}

function keepInsideField(object) {
    object.x = Math.max(L + object.radius, Math.min(R - object.radius, object.x));
    object.y = Math.max(T + object.radius, Math.min(B - object.radius, object.y));
}

function hitCornerKick() {
    const collisionRadius = CORNER_RADIUS + ball.radius;

    for (const corner of corners) {
        const dx = ball.x - corner.x;
        const dy = ball.y - corner.y;

        if (dx * corner.sx < 0 || dy * corner.sy < 0) {
            continue;
        }

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (
            distance < collisionRadius &&
            distance > 0 &&
            distance > CORNER_RADIUS - ball.radius
        ) {
            const nx = dx / distance;
            const ny = dy / distance;

            ball.x = corner.x + nx * collisionRadius;
            ball.y = corner.y + ny * collisionRadius;

            const velocityTowardCorner = ball.vx * nx + ball.vy * ny;

            if (velocityTowardCorner < 0) {
                ball.vx -= 2 * velocityTowardCorner * nx;
                ball.vy -= 2 * velocityTowardCorner * ny;

                ball.vx *= CORNER_BOOST;
                ball.vy *= CORNER_BOOST;

                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);

                if (speed < CORNER_MIN_SPEED) {
                    const scale = CORNER_MIN_SPEED / Math.max(speed, 0.001);
                    ball.vx *= scale;
                    ball.vy *= scale;
                }
            }
        }
    }
}

function updateBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.vx *= Math.pow(ball.friction, dt);
    ball.vy *= Math.pow(ball.friction, dt);

    // Spin the ball image as it travels
    ball.angle += (ball.vx / ball.radius) * dt * 0.6;

    hitCornerKick();

    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > MAX_BALL_SPEED) {
        ball.vx *= MAX_BALL_SPEED / spd;
        ball.vy *= MAX_BALL_SPEED / spd;
    }

    if (ball.y - ball.radius < T) {
        ball.y = T + ball.radius;
        ball.vy = Math.abs(ball.vy) * ball.bounce;
    }

    if (ball.y + ball.radius > B) {
        ball.y = B - ball.radius;
        ball.vy = -Math.abs(ball.vy) * ball.bounce;
    }

    hitPosts();

    const goalTop = CENTER_Y - GOAL_HALF;
    const goalBottom = CENTER_Y + GOAL_HALF;
    const inGoalMouth = ball.y > goalTop && ball.y < goalBottom;

    // Left goal: ball must fully cross the line
    if (inGoalMouth && ball.x + ball.radius < L) {
        scoreGoal("robot");
        return;
    }
    if (!inGoalMouth && ball.x - ball.radius < L) {
        ball.x = L + ball.radius;
        ball.vx = Math.abs(ball.vx) * ball.bounce;
    }

    // Right goal
    if (inGoalMouth && ball.x - ball.radius > R) {
        scoreGoal("player");
        return;
    }
    if (!inGoalMouth && ball.x + ball.radius > R) {
        ball.x = R - ball.radius;
        ball.vx = -Math.abs(ball.vx) * ball.bounce;
    }
}

// Goal posts: the ball bounces off them
function hitPosts() {
    const posts = [
        { x: L, y: CENTER_Y - GOAL_HALF },
        { x: L, y: CENTER_Y + GOAL_HALF },
        { x: R, y: CENTER_Y - GOAL_HALF },
        { x: R, y: CENTER_Y + GOAL_HALF }
    ];

    for (const post of posts) {
        const dx = ball.x - post.x;
        const dy = ball.y - post.y;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + POST_RADIUS;

        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;

            ball.x = post.x + nx * minDist;
            ball.y = post.y + ny * minDist;

            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                ball.vx -= 1.9 * vn * nx;
                ball.vy -= 1.9 * vn * ny;
            }
        }
    }
}

function collide(object) {
    let dx = ball.x - object.x;
    let dy = ball.y - object.y;
    let dist = Math.hypot(dx, dy);
    const minDist = ball.radius + object.radius;

    if (dist >= minDist) return;

    if (dist === 0) {
        dx = 1;
        dy = 0;
        dist = 1;
    }

    const nx = dx / dist;
    const ny = dy / dist;

    ball.x += nx * (minDist - dist);
    ball.y += ny * (minDist - dist);

    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
        ball.vx -= 1.6 * vn * nx;
        ball.vy -= 1.6 * vn * ny;
    }

    const kickPower = object === player ? 9 : 7;
    const vn2 = ball.vx * nx + ball.vy * ny;
    if (vn2 < kickPower) {
        ball.vx += nx * (kickPower - vn2);
        ball.vy += ny * (kickPower - vn2);
    }
}

function scoreGoal(team) {
    if (team === "player") {
        playerScore++;
        messageElement.textContent = "GOAL! " + PLAYER_NAME;
    } else {
        robotScore++;
        messageElement.textContent = "GOAL! " + ROBOT_NAME;
    }

    updateScoreboard();
    resetPositions();
}

function updateScoreboard() {
    playerScoreElement.textContent = playerScore;
    robotScoreElement.textContent = robotScore;

    const minutes = Math.floor(matchTime / 60);
    const seconds = Math.floor(matchTime % 60);

    timerElement.textContent = minutes + ":" + String(seconds).padStart(2, "0");
}

function endGame() {
    gameState = "over";

    if (playerScore > robotScore) {
        messageElement.textContent = PLAYER_NAME + " wins!";
    } else if (robotScore > playerScore) {
        messageElement.textContent = ROBOT_NAME + " wins!";
    } else {
        messageElement.textContent = "It's a tie!";
    }

    startButton.textContent = "PLAY AGAIN";
    startButton.classList.remove("hidden");
}

function update(dt) {
    if (gameState !== "playing") return;

    matchTime -= dt / 60;

    if (matchTime <= 0) {
        matchTime = 0;
        updateScoreboard();
        endGame();
        return;
    }

    if (kickoffTimer > 0) {
        kickoffTimer -= dt / 60;
        if (kickoffTimer <= 0) messageElement.textContent = "";
        updateBall(dt);
        updateScoreboard();
        return;
    }

    movePlayer(dt);
    moveRobot(dt);
    updateBall(dt);

    collide(player);
    collide(robot);

    updateScoreboard();
}

function drawGoal(side) {
    const x = side === "left" ? L - GOAL_DEPTH : R;
    const y = CENTER_Y - GOAL_HALF;
    const h = GOAL_HALF * 2;

    ctx.save();

    // Net background
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.fillRect(x, y, GOAL_DEPTH, h);

    // Net mesh
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gy = y; gy <= y + h; gy += 12) {
        ctx.moveTo(x, gy);
        ctx.lineTo(x + GOAL_DEPTH, gy);
    }
    for (let gx = x; gx <= x + GOAL_DEPTH; gx += 12) {
        ctx.moveTo(gx, y);
        ctx.lineTo(gx, y + h);
    }
    ctx.stroke();

    // Frame (top bar, back bar, bottom bar)
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.beginPath();
    if (side === "left") {
        ctx.moveTo(L, y);
        ctx.lineTo(x, y);
        ctx.lineTo(x, y + h);
        ctx.lineTo(L, y + h);
    } else {
        ctx.moveTo(R, y);
        ctx.lineTo(x + GOAL_DEPTH, y);
        ctx.lineTo(x + GOAL_DEPTH, y + h);
        ctx.lineTo(R, y + h);
    }
    ctx.stroke();

    // Posts
    const postX = side === "left" ? L : R;
    ctx.fillStyle = "white";
    ctx.strokeStyle = "#666";
    ctx.lineWidth = 2;
    for (const py of [y, y + h]) {
        ctx.beginPath();
        ctx.arc(postX, py, POST_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();
}

function drawField() {
    // Background photo
    if (fieldImage.complete && fieldImage.naturalWidth > 0) {
        ctx.drawImage(fieldImage, 0, 0, WIDTH, HEIGHT);
    } else {
        ctx.fillStyle = "#1f4d2a";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.strokeRect(L, T, R - L, B - T);
    }

    // Goals
    drawGoal("left");
    drawGoal("right");

    // Corner quarter circles (the ball bounces off these fast)
    for (const corner of corners) {
        ctx.beginPath();
        ctx.moveTo(corner.x, corner.y);
        ctx.arc(corner.x, corner.y, CORNER_RADIUS, corner.start, corner.start + Math.PI / 2);
        ctx.closePath();
        ctx.fillStyle = "rgba(232, 211, 107, 0.25)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(corner.x, corner.y, CORNER_RADIUS, corner.start, corner.start + Math.PI / 2);
        ctx.strokeStyle = "#e8d36b";
        ctx.lineWidth = 5;
        ctx.stroke();
    }
}

function drawPlayer(object, label) {
    ctx.save();

    if (object.image.complete && object.image.naturalWidth > 0) {
        ctx.drawImage(
            object.image,
            object.x - object.radius,
            object.y - object.radius,
            object.radius * 2,
            object.radius * 2
        );
    } else {
        // Fallback circle if the image is missing
        ctx.beginPath();
        ctx.fillStyle = object.color;
        ctx.arc(object.x, object.y, object.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.font = "bold 17px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(object.number, object.x, object.y);
    }

    ctx.font = "bold 14px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "white";
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 4;

    ctx.fillText(label, object.x, object.y - object.radius - 13);

    ctx.restore();
}

function drawBall() {
    ctx.save();

    // Shadow
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.ellipse(ball.x + 3, ball.y + 6, ball.radius, ball.radius * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();

    if (ballImage.complete && ballImage.naturalWidth > 0) {
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.angle);
        ctx.drawImage(ballImage, -ball.radius, -ball.radius, ball.radius * 2, ball.radius * 2);
    } else {
        ctx.beginPath();
        ctx.fillStyle = "#f5f5ed";
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function ballIsInCorner() {
    const cornerDistance = 90;

    const nearLeft = ball.x < L + cornerDistance;
    const nearRight = ball.x > R - cornerDistance;
    const nearTop = ball.y < T + cornerDistance;
    const nearBottom = ball.y > B - cornerDistance;

    return (nearLeft || nearRight) && (nearTop || nearBottom);
}

function draw() {
    drawField();

    if (ballIsInCorner()) {
        drawBall();
        drawPlayer(player, PLAYER_NAME);
        drawPlayer(robot, ROBOT_NAME);
    } else {
        drawPlayer(player, PLAYER_NAME);
        drawPlayer(robot, ROBOT_NAME);
        drawBall();
    }

    if (gameState === "menu") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 48px " + FONT;
        ctx.fillText("SOCCER", CENTER_X, CENTER_Y - 45);

        ctx.font = "20px " + FONT;
        ctx.fillText(PLAYER_NAME + "  vs  " + ROBOT_NAME, CENTER_X, CENTER_Y + 5);

        ctx.font = "16px " + FONT;
        ctx.fillText("120 SECOND MATCH", CENTER_X, CENTER_Y + 38);
    }

    if (gameState === "over") {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 48px " + FONT;
        ctx.fillText("FULL TIME", CENTER_X, CENTER_Y - 25);

        ctx.font = "25px " + FONT;
        ctx.fillText(playerScore + "  -  " + robotScore, CENTER_X, CENTER_Y + 25);
    }

    if (gameState === "playing" && kickoffTimer > 0) {
        ctx.save();
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 28px " + FONT;
        ctx.shadowColor = "black";
        ctx.shadowBlur = 4;
        ctx.fillText("KICKOFF", CENTER_X, CENTER_Y - 65);
        ctx.restore();
    }
}

function loop(timestamp) {
    const dt = lastTime
        ? Math.min((timestamp - lastTime) / (1000 / 60), 2)
        : 1;

    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

startButton.addEventListener("click", startGame);

resetPositions();
draw();
requestAnimationFrame(loop);
</script>

</body>
